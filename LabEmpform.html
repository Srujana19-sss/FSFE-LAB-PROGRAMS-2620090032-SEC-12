<html>
    <head>
        <title>
            Employee Registration Form
        </title>
    </head>
    <body style "background-color:yellow;">
        <h1>Employee Registration Form</h1>

        <form>
        Employee Name: <input type="text" name="g1" placeholder="Enter your name" required> <br>
        Password: <input type="password" name="g2" minlength="7" required> <br>
        Email: <input type="email" name="g3" placeholder="abc@gmail.com"  required> <br>
        Mobile Number: <input type="number" name="g4" placeholder="Enter mobile no." pattern="[0-9]{10}" required><br>
        Age: <input type="number" name="g5" required > <br>
        Date of birth: <input type="number" name="g5"  placeholder="dd-mm-yyyy" pattern="\d{2}-\d{2}-\d{4}" required><br>
        Preferred interview Time: <input type="time" name="g6" required.<br>
        Gender: <input type="radio" name="g7" required>Male
                <input type="radio" name="g7"  required>Female<br><br>


        Skills: <input type="checkbox" name="g8">HTML
                
                         <input type="checkbox" name="g8">CSS
                         <input type="checkbox" name="g8">Java Script
                         <br>

        Student Department: <select name="g9" required>
                            <option value="1">SELECT</option>
                <option>HR</option>
                <option>Developer</option>
                <option>Finance</option>
        </select>
        <br>

        Upload Resume: <input type="file" name="g10" accept=".pdf," <br> <br> 

        Address: <textarea name="g11" required rows="4" cols="35" placeholder="Enter your address"></textarea><br> <br>
        
        Work Experience:    <label>Work Experience:</label>
    <input type="range" min="0" max="20"><br><br>

      <label>LinkedIn Profile:</label>
    <input type="url" placeholder="Enter LinkedIn URL"><br><br>

    <button type="submit">Register</button>
    <button type="reset">reset</button>
       </form>
    </body>
</html>
